<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>PrairieLearn-style sketch demo</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
    />
    <style>
      .js-overlay-toggle {
        width: 2rem;
        height: 2rem;
      }
    </style>
    <script src="sketchresponse.min.js"></script>
  </head>
  <body class="bg-body-tertiary">
    <main class="container-fluid py-4" style="max-width: 1320px">
      <section class="card mb-4" aria-labelledby="question-heading">
        <h1 id="question-heading" class="card-header h6 mb-0">Question</h1>
        <div
          id="question"
          class="card-body d-flex justify-content-center"
        ></div>
      </section>
      <section class="card mb-4" aria-labelledby="submission-heading">
        <h2 id="submission-heading" class="card-header h6 mb-0">Submission</h2>
        <div
          id="submission"
          class="card-body d-flex justify-content-center"
        ></div>
      </section>
      <section class="card" aria-labelledby="all-tools-heading">
        <h2 id="all-tools-heading" class="card-header h6 mb-0">All tools</h2>
        <div
          id="all-tools"
          class="card-body d-flex justify-content-center"
        ></div>
      </section>
    </main>
    <script src="debugConfigs.js"></script>
    <script src="pl-demo.js"></script>
  </body>
</html>
